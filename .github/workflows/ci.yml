name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kopipass
          POSTGRES_PASSWORD: kopipass
          POSTGRES_DB: kopipass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kopipass" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kopipass:kopipass@localhost:5432/kopipass_test?schema=public
      TEST_DATABASE_URL: postgresql://kopipass:kopipass@localhost:5432/kopipass_test?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
